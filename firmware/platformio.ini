; Voice dictation stick — Atech Tiny (3-port) board
;
;   Port 1+2 : Microphone (double module)
;   Port 3   : Button
;   Port 4   : USB-C (native USB, the only USB port on the Tiny)
;
; Build:  pio run
; Flash:  pio run -t upload
; Watch:  don't — the host app (../host/voicetype.py) owns the serial port.

[env:tiny]
platform = espressif32@~6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

upload_flags =
    --before=default_reset
    --after=hard_reset

; The Tiny has 4 MB flash, not 8 MB — the default 8 MB image does not boot.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi

; ARDUINO_USB_* are required on the ESP32-S3 or USB serial never appears.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -I${sysenv.ATECH_LIB}
    -I${sysenv.ATECH_LIB}/drivers

; The Atech driver library is referenced in place: set ATECH_LIB to its
; firmware/esp32 folder, e.g. export ATECH_LIB=~/atech_docs/firmware/esp32
; Its srcFilter compiles every
; driver, so every driver's dependency must resolve.
lib_deps =
    symlink://${sysenv.ATECH_LIB}
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.0
    madhephaestus/ESP32Encoder@^0.11.7
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit Unified Sensor@^1.1.9
    sparkfun/SparkFun VL53L5CX Arduino Library
    links2004/WebSockets@^2.6.1

; Mic wiring diagnostic: pio run -e diag -t upload
[env:diag]
extends = env:tiny
build_src_filter = -<*> +<../diag/diag.cpp>
