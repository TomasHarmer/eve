; Voice dictation stick — Atech Tiny (3-port) board
;
;   Port 1+2 : Microphone (double module)
;   Port 3   : Button
;   Port 4   : USB-C (native USB, the only USB port on the Tiny)
;
; Build:  pio run
; Flash:  pio run -t upload
; Watch:  don't — the host app (../host/voicetype.py) owns the serial port.

[platformio]
; Plain `pio run -t upload` flashes eve only, not the diagnostic below.
default_envs = tiny

[env:tiny]
platform = espressif32@~6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

upload_flags =
    --before=default_reset
    --after=hard_reset

; The Tiny has 4 MB flash, not 8 MB — the default 8 MB image does not boot.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi

; ARDUINO_USB_* are required on the ESP32-S3 or USB serial never appears.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; The Atech button and microphone drivers are in lib/atech (see its README).
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5

; Mic wiring diagnostic: pio run -e diag -t upload
[env:diag]
extends = env:tiny
build_src_filter = -<*> +<../diag/diag.cpp>
